name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  AZURE_RESOURCE_GROUP: investflow-rg
  ACR_NAME: investflowregistry
  ACR_SERVER: investflowregistry.azurecr.io
  BACKEND_APP: investflow-backend
  FRONTEND_APP: investflow-frontend
  BACKEND_URL: https://investflow-backend.yellowsky-ca466dfe.eastus.azurecontainerapps.io
  FRONTEND_URL: https://investflow-frontend.yellowsky-ca466dfe.eastus.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Backend
        run: |
          cd backend
          docker build --platform linux/amd64 \
            -t ${{ env.ACR_SERVER }}/backend:latest \
            -t ${{ env.ACR_SERVER }}/backend:${{ github.sha }} \
            .
          docker push ${{ env.ACR_SERVER }}/backend:latest
          docker push ${{ env.ACR_SERVER }}/backend:${{ github.sha }}

      - name: Build and push Frontend
        run: |
          cd frontend
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            -t ${{ env.ACR_SERVER }}/frontend:latest \
            -t ${{ env.ACR_SERVER }}/frontend:${{ github.sha }} \
            .
          docker push ${{ env.ACR_SERVER }}/frontend:latest
          docker push ${{ env.ACR_SERVER }}/frontend:${{ github.sha }}

      - name: Deploy Backend
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/backend:${{ github.sha }} \
            --min-replicas 1 \
            --max-replicas 3 \
            --set-env-vars \
              CORS_ORIGINS=${{ env.FRONTEND_URL }} \
              USE_POSTGRES_STORE=true
          REV=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.latestRevisionName -o tsv)
          echo "Waiting for backend revision $REV"
          for i in $(seq 1 36); do
            mapfile -t STATUS < <(az containerapp revision show \
              --name ${{ env.BACKEND_APP }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" \
              --query "[properties.healthState, properties.runningState]" -o tsv)
            HEALTH=${STATUS[0]:-}
            STATE=${STATUS[1]:-}
            echo "attempt $i health=$HEALTH running=$STATE"
            if [ "$HEALTH" = "Healthy" ]; then
              exit 0
            fi
            case "$STATE" in
              Failed|Degraded|Stopped)
                echo "Backend revision $REV did not start"
                az containerapp logs show \
                  --name ${{ env.BACKEND_APP }} \
                  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                  --revision "$REV" --tail 50 --type console || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Backend revision $REV never became healthy"
          exit 1

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/frontend:${{ github.sha }} \
            --min-replicas 1 \
            --max-replicas 3
          REV=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.latestRevisionName -o tsv)
          echo "Waiting for frontend revision $REV"
          for i in $(seq 1 36); do
            mapfile -t STATUS < <(az containerapp revision show \
              --name ${{ env.FRONTEND_APP }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" \
              --query "[properties.healthState, properties.runningState]" -o tsv)
            HEALTH=${STATUS[0]:-}
            STATE=${STATUS[1]:-}
            echo "attempt $i health=$HEALTH running=$STATE"
            if [ "$HEALTH" = "Healthy" ]; then
              exit 0
            fi
            case "$STATE" in
              Failed|Degraded|Stopped)
                echo "Frontend revision $REV did not start"
                az containerapp logs show \
                  --name ${{ env.FRONTEND_APP }} \
                  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                  --revision "$REV" --tail 50 --type console || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Frontend revision $REV never became healthy"
          exit 1

      - name: Deployment Summary
        run: |
          echo "✅ Deployment complete!"
          echo "Frontend: ${{ env.FRONTEND_URL }}"
          echo "Backend: ${{ env.BACKEND_URL }}"
          echo "Commit: ${{ github.sha }}"
